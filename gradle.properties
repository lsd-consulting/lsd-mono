# Fixed "generated at" instant for the sample reports (README, feature tour, kitchen sink),
# so regenerating them only changes them when the UI or a sample changes.
lsd.samples.generatedAt=2026-01-01T12:00:00Z

# Reuse task outputs (build cache), build modules in parallel, and skip configuration when the
# build scripts and their inputs have not changed (configuration cache). Exec tasks look up
# Node when they run, not while Gradle configures, so the configuration cache stays valid.
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Toolchains: on CI, setup-java exports JAVA_HOME_<major>_X64 for each JDK it installs; tell Gradle
# to look there so it does not download them again. Locally these are unset and Gradle detects the
# JDKs it usually finds (or provisions one through foojay); system defaults are never changed.
org.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64
