name: Pages

# Builds the sample site (the example report and the index.html that lsd-mono-core writes
# for it, generated from the current report UI and KitchenSinkSample.kt) and publishes it to
# GitHub Pages, so https://lsd-consulting.github.io/lsd-mono/ opens the report index and
# example-report.html opens the report on its own. spring-boot-4/ is the Spring Boot starter's
# sample report (the shop fixtures, run by its sampleReport task), linked from its README.
# The example report is not committed; nothing else under docs/ is published.
#
# The site is the latest release: the version the README tells people to use. It deploys after
# the Gradle workflow passes on a push to main and only when that run released, so the commit
# has its vX.Y.Z tag and the report shows that version. A push that releases nothing leaves the
# site as it is. Run it by hand to deploy main (shown as the next patch snapshot, such as
# 0.3.1-SNAPSHOT) or, with `ref`, a release tag. The checkout has the full history and the tags,
# which the train version reads (TrainVersion.kt). The site never pings (writesSampleReport turns
# the usage ping off).
on:
  workflow_run:
    workflows: [Gradle]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or commit to deploy, such as v0.3.0. Empty for main."
        required: false
        default: ""

permissions:
  contents: read

# One deployment at a time; let a running one finish rather than cancel it mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # A passing build of a push to main that tagged its commit, or a run by hand.
  released:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - id: ref
        env:
          EVENT: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.ref }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.server_url }}/${{ github.repository }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "ref=${INPUT_REF:-$GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Release tags are lightweight; an annotated one lists its commit on a ^{} line.
          tag=$(git ls-remote --tags "$REPO" 'v[0-9]*' | awk -v sha="$SHA" '$1 == sha { sub("refs/tags/", "", $2); sub(/\^\{\}$/, "", $2); print $2; exit }')
          if [ -z "$tag" ]; then
            echo "$SHA released nothing, so the site stays on the last release."
            exit 0
          fi
          echo "$SHA is $tag"
          echo "ref=$tag" >> "$GITHUB_OUTPUT"

  deploy:
    needs: released
    if: needs.released.outputs.ref
    # Pinned for the same reason as the Gradle workflow. See docs/ci.md.
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # Only this job deploys, so only it gets the Pages and OIDC token permissions.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release tag, or what was asked for by hand.
          ref: ${{ needs.released.outputs.ref }}
          # Every tag, so the version is the release's (or the next snapshot), not 0.0.1-SNAPSHOT.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            17
            25
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: modules/lsd-mono-report-html/ui/package-lock.json
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build the sample site
        run: |
          ./gradlew :modules:lsd-mono-core:kitchenSinkSample :modules:lsd-mono-spring-boot-4:sampleReport
          # The Spring Boot starter's sample report, under spring-boot-4/ (its README links there).
          mkdir -p modules/lsd-mono-core/build/pages/spring-boot-4
          cp -R modules/lsd-mono-spring-boot-4/build/pages/. modules/lsd-mono-core/build/pages/spring-boot-4/
      - name: Check the site
        run: |
          version=$(./gradlew -q printVersion)
          echo "Site built as $version"
          [ "$version" != 0.0.1-SNAPSHOT ] || { echo "::error::no tags in the checkout, so no version"; exit 1; }
          site=modules/lsd-mono-core/build/pages
          for f in index.html example-report.html; do
            test -s "$site/$f" || { echo "missing $site/$f"; exit 1; }
          done
          grep -qF 'window.__LSD_INDEX__=' "$site/index.html" || { echo "index.html has no report manifest"; exit 1; }
          # Every script the pages load is published.
          for f in $(grep -ohE 'Example-report-[0-9a-f]{8}-(report|payloads)\.js' "$site/index.html" "$site/example-report.html" "$site"/*-report.js | sort -u); do
            test -s "$site/$f" || { echo "missing $site/$f"; exit 1; }
          done
          spring=$site/spring-boot-4
          for f in index.html shop-report.html kafka-shop-report.html kafka-send-failure-report.html; do
            test -s "$spring/$f" || { echo "missing $spring/$f"; exit 1; }
          done
          grep -qF 'window.__LSD_INDEX__=' "$spring/index.html" || { echo "spring-boot-4/index.html has no report manifest"; exit 1; }
          for f in $(grep -ohE '(kafka-shop|kafka-send-failure|shop)-fixture-[0-9a-f]{8}-(report|payloads)\.js' "$spring"/*.html "$spring"/*-report.js | sort -u); do
            test -s "$spring/$f" || { echo "missing $spring/$f"; exit 1; }
          done
      # One artifact name per attempt (#108). Each attempt of a run uploads into that same run, so
      # with the default name a rerun of a failed deploy found two github-pages artifacts and
      # failed every time. See "Pages reruns" in docs/ci.md.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: modules/lsd-mono-core/build/pages
          name: github-pages-${{ github.run_attempt }}
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
