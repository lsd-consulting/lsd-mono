name: Pages

# Builds the sample site (the example report and the index.html that lsd-mono-core writes
# for it, generated from the current report UI and KitchenSinkSample.kt) and publishes it to
# GitHub Pages, so https://lsd-consulting.github.io/lsd-mono/ opens the report index and
# example-report.html opens the report on its own.
# The example report is not committed; nothing else under docs/ is published.
on:
  push:
    branches: [main]
    paths:
      - "modules/lsd-mono-core/**"
      - "build-logic/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; let a running one finish rather than cancel it mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Pinned for the same reason as the Gradle workflow. See docs/ci.md.
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # Only this job deploys, so only it gets the Pages and OIDC token permissions.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            17
            25
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: modules/lsd-mono-core/report/package-lock.json
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build the sample site
        run: ./gradlew :modules:lsd-mono-core:kitchenSinkSample
      - name: Check the site
        run: |
          site=modules/lsd-mono-core/build/pages
          for f in index.html example-report.html; do
            test -s "$site/$f" || { echo "missing $site/$f"; exit 1; }
          done
          grep -qF 'window.__LSD_INDEX__=' "$site/index.html" || { echo "index.html has no report manifest"; exit 1; }
          # Every script the pages load is published.
          for f in $(grep -ohE 'Example-report-[0-9a-f]{8}-(report|payloads)\.js' "$site/index.html" "$site/example-report.html" "$site"/*-report.js | sort -u); do
            test -s "$site/$f" || { echo "missing $site/$f"; exit 1; }
          done
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: modules/lsd-mono-core/build/pages
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
