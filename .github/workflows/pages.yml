name: Pages

# Builds the sample site (docs/samples/index.html plus the kitchen-sink report, generated
# from the current report UI and KitchenSinkSample.kt) and publishes it to GitHub Pages,
# so https://lsd-consulting.github.io/lsd-mono/kitchen-sink.html opens as a page.
# The kitchen-sink report is not committed; nothing else under docs/ is published.
on:
  push:
    branches: [main]
    paths:
      - "docs/samples/**"
      - "modules/lsd-mono-core/**"
      - "build-logic/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; let a running one finish rather than cancel it mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Pinned for the same reason as the Gradle workflow. See docs/ci.md.
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # Only this job deploys, so only it gets the Pages and OIDC token permissions.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}kitchen-sink.html
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: modules/lsd-mono-core/report/package-lock.json
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build the sample site
        run: ./gradlew :modules:lsd-mono-core:kitchenSinkSample
      - name: Check the site
        run: |
          site=modules/lsd-mono-core/build/pages
          for f in index.html kitchen-sink.html kitchen-sink-payloads.js; do
            test -s "$site/$f" || { echo "missing $site/$f"; exit 1; }
          done
          grep -qF '__LSD_PAYLOADS_SRC__="kitchen-sink-payloads.js"' "$site/kitchen-sink.html" \
            || { echo "kitchen-sink.html does not load kitchen-sink-payloads.js"; exit 1; }
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: modules/lsd-mono-core/build/pages
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
