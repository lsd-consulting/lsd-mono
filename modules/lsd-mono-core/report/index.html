<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <script data-theme-boot>
      // Before first paint, so there is no flash of the wrong theme. Mirrors resolveTheme in src/ui/theme.ts.
      try {
        var t = localStorage.getItem('lsd-report-theme')
        if (t !== 'dark' && t !== 'light' && t !== 'contrast') {
          t = matchMedia('(prefers-contrast: more)').matches
            ? 'contrast'
            : matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
        }
        document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
    <title>LSD Report — Living Sequence Diagrams</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
