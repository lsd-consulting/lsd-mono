[versions]
kotlin = "2.4.21"
# The Java baseline: bytecode and API level (--release), toolchain, and default test JDK.
# CI also tests on newer JDKs (gradle.yml). See lsd.kotlin-jvm.gradle.kts.
jvm = "17"
junit = "6.1.3"
cucumber = "8.0.4"
kotlinx-coroutines = "1.11.0"
json-schema-validator = "3.0.8"
spotless = "8.10.4"
ktlint = "1.8.0"
kover = "0.9.11"
# Javadoc jars for Maven Central (Dokka's javadoc format), as lsd-core does.
dokka = "2.2.0"
# Publishes to Maven Central through the Central Portal's OSSRH staging API, as lsd-core does.
nexus-publish = "2.0.0"
[libraries]
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
spotless-gradle-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
kover-gradle-plugin = { module = "org.jetbrains.kotlinx:kover-gradle-plugin", version.ref = "kover" }
dokka-gradle-plugin = { module = "org.jetbrains.dokka:dokka-gradle-plugin", version.ref = "dokka" }
# Not a dependency: Spotless downloads this ktlint version (lsd.formatting reads the version),
# and listing it here lets Renovate propose updates.
ktlint-cli = { module = "com.pinterest.ktlint:ktlint-cli", version.ref = "ktlint" }

# JUnit 6 / Jupiter 6. junit-bom 6.x manages org.junit.platform on the same major.
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }

# Cucumber 8. Only lsd-mono-cucumber-8 uses these.
cucumber-bom = { module = "io.cucumber:cucumber-bom", version.ref = "cucumber" }
cucumber-plugin = { module = "io.cucumber:cucumber-plugin", version.ref = "cucumber" }
cucumber-java8 = { module = "io.cucumber:cucumber-java8", version.ref = "cucumber" }
cucumber-junit-platform-engine = { module = "io.cucumber:cucumber-junit-platform-engine", version.ref = "cucumber" }

# kotlinx.coroutines 1. Only lsd-mono-coroutines uses it.
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }

# Test only: lsd-mono-core's tests validate real report output against the report JSON Schema.
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "json-schema-validator" }

# Test only: lsd-mono-report-model's tests read the model's constructor parameters.
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }


[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
nexus-publish = { id = "io.github.gradle-nexus.publish-plugin", version.ref = "nexus-publish" }
