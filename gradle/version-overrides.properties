# Divergences from the root train version. No entries means every module is on the train.
#
# patch: same major.minor as the train, a higher patch. One artifact only.
#   :modules:lsd-mono-cucumber-8=patch:1.2.1
#
# solo-major: an integration on its own clock, while the train major is still N.
# Not valid for :modules:lsd-mono-core. When the train major leaves N, delete the line.
#   :modules:lsd-mono-junit-jupiter=solo-major:1.0.0 train-major:1
#   :modules:lsd-mono-junit-jupiter=solo-major:2.0.0 train-major:1
